  return intervals(ys).flatMap(([y0,y1]) => intervals(xs)
    .filter(([x0,x1]) => accept((x0+x1)/2, (y0+y1)/2))
    .map(([x0,x1]) => [x0,y0,x1,y1]));
}

function perimeter(room, parent, exterior, thickness) {
  const edges = [];
  for (const orient of ['h', 'v']) {
    const axis = orient === 'h' ? 0 : 1;
    const cross = 1 - axis;
    const lines = sorted(room.flatMap(r => [r[cross], r[cross + 2]]));
    const cuts = sorted([...room, ...parent, ...exterior]
      .flatMap(r => [r[axis],r[axis + 2]]));
    for (const line of lines) {
      for (const [start,end] of intervals(cuts)) {
        const point = offset => orient === 'h'
          ? [(start+end)/2, line+offset] : [line+offset, (start+end)/2];
        const positive = unionContains(room, ...point(0.25));
        if (positive === unionContains(room, ...point(-0.25))) continue;
        const inward = positive ? 1 : -1;
        const outer = exterior.some(r => r[cross] === line && start >= r[axis] && end <= r[axis+2]);
        const kind = outer ? 'exterior' :
          unionContains(parent, ...point(-inward*0.25)) ? 'internal_partition' : 'between_zones';
        const previous = edges.at(-1);
        if (previous && previous.orient === orient && previous.line === line &&
            previous.end === start && previous.inward === inward && previous.kind === kind) {
          previous.end = end;
          continue;
        }
        edges.push({orient, line, start, end, inward, kind, half: mm(thickness[kind + '_m'])/2});
      }
    }
  }
  return edges.map((edge,i) => ({...edge, id: 'wall-' + (i+1)}));
}
function strip(edge, start, end, low, high) {
  return edge.orient === 'h' ? [start,edge.line+low,end,edge.line+high]
    : [edge.line+low,start,edge.line+high,end];
}

const area = rects => rects.reduce((sum,rect) => sum+rectArea(rect),0)/1e6;
const toExterior = e => [...e.a,...e.b].map(mm);
const edgeAxis = orient => orient === 'h' ? 0 : 1;

function mergeWalls(rooms) {
  const byLine = new Map();
  for (const room of rooms) for (const edge of room.edges) {
    const key = edge.orient+':'+edge.line;
    if (!byLine.has(key)) byLine.set(key,[]);
    byLine.get(key).push({...edge, room});
  }
  const walls = [];
  for (const edges of byLine.values()) {
    for (const [start,end] of intervals(sorted(edges.flatMap(e=>[e.start,e.end])))) {
      const covering = edges.filter(e=>e.start<=start && e.end>=end);
      if (!covering.length) continue;
      const {orient,line,kind,half} = covering[0];
      if (covering.some(e=>e.kind!==kind || e.half!==half) ||
          covering.length > 2 || (covering.length===2 && covering[0].inward===covering[1].inward)) {
        throw new Error('壁の境界分類が一致しません '+orient+' '+line+' '+start);
      }
      const roomIds = covering.map(e=>e.room.id).sort();
      const wall = {id:'wall:'+orient+':'+line+':'+start,orient,line,kind,half,start,end,
        height:Math.max(...covering.map(e=>e.room.height)),roomIds,sides:covering};
      walls.push(wall);
    }
  }
  return walls;
}

function openings(data, rooms, walls) {
  const apertures = [
    ...data.doors.map(d=>({...d,type:'door',xy:d.at,width:d.clear_width_m,bottom:0,
      top:data.display.doorHeightsM[d.id],roomIds:d.between.map(id=>data.assembly?.doorRoomAliases[id]??id).filter(id=>rooms.some(r=>r.id===id))})),
    ...rooms.flatMap(room=>room.source.windows.map((w,i)=>({...w,windowType:w.type,type:'window',
      id:w.id||room.source.short_id+'.window.'+(i+1),xy:w.centre,width:w.width_m,
      bottom:w.sill_m,top:w.head_m??data.display.windowHeadsM?.[w.id||room.source.short_id+'.window.'+(i+1)]??data.display.windowHeadM,roomIds:[room.id]})))
  ];
  for (const aperture of apertures) {
    const axis = edgeAxis(aperture.orient);
    const middle = mm(aperture.xy[axis]);
    aperture.start = middle-mm(aperture.width)/2;
    aperture.end = middle+mm(aperture.width)/2;
    const spans = walls.filter(w=>w.orient===aperture.orient && w.line===mm(aperture.xy[1-axis]) &&
      w.start<aperture.end && w.end>aperture.start);
    if (!spans.length || !Number.isFinite(aperture.top) || aperture.bottom>=aperture.top ||
        spans.some(w=>w.height<aperture.top || w.half!==spans[0].half ||
          w.roomIds.join()!==[...aperture.roomIds].sort().join()) ||
        spans.reduce((sum,w)=>sum+Math.min(w.end,aperture.end)-Math.max(w.start,aperture.start),0)!==
          aperture.end-aperture.start) throw new Error('開口境界を照合できません: '+aperture.id);
    aperture.rect = strip(spans[0],aperture.start,aperture.end,-spans[0].half,spans[0].half);
  }
  return apertures;
}

function wallSolids(walls, apertures, parent) {
  const volumes = walls.map(w=>({wall:w,rect:strip(w,w.start,w.end,-w.half,w.half)}));
  // Close convex corners of the outside perimeter. Shared partitions and T-junctions already intersect.
  for (const h of walls.filter(w=>w.orient==='h' && w.sides.length===1)) {
    for (const v of walls.filter(w=>w.orient==='v' && w.sides.length===1)) {
      if (![h.start,h.end].includes(v.line) || ![v.start,v.end].includes(h.line)) continue;
      const x=v.line,y=h.line;
      const quadrants=[-1,1].flatMap(dx=>[-1,1].map(dy=>unionContains(parent,x+dx,y+dy)));
      if (quadrants.filter(Boolean).length!==1) continue;
      const ax=x-v.sides[0].inward*v.half, ay=y-h.sides[0].inward*h.half;
      const wall=h.height<=v.height?h:v;
      volumes.push({wall,rect:[Math.min(x,ax),Math.min(y,ay),Math.max(x,ax),Math.max(y,ay)]});
    }
  }
  const heights=sorted([0,...walls.map(w=>w.height),...apertures.flatMap(o=>[o.bottom,o.top])]);
  const boxes=[];
  for (const [lo,hi] of intervals(heights)) {
    const solid=volumes.filter(v=>v.wall.height>=hi);
    const cuts=apertures.filter(o=>lo>=o.bottom && hi<=o.top).map(o=>o.rect);
    const rects=[...solid.map(v=>v.rect),...cuts];
    const xCoords=sorted(rects.flatMap(r=>[r[0],r[2]]));
    const yCoords=sorted(rects.flatMap(r=>[r[1],r[3]]));
    const xIndex=new Map(xCoords.map((value,i)=>[value,i]));
    const yIndex=new Map(yCoords.map((value,i)=>[value,i]));
    const cols=xCoords.length-1,rows=yCoords.length-1;
    const cells=new Int16Array(cols*rows);
    function paint([a,b,c,d],value) {
      for(let y=yIndex.get(b);y<yIndex.get(d);y++) {
        for(let x=xIndex.get(a);x<xIndex.get(c);x++) cells[y*cols+x]=value;
      }
    }
    // First source wall owns a physical junction. Doors and windows clear all ownership.
    for(let i=solid.length-1;i>=0;i--) paint(solid[i].rect,i+1);
    for(const cut of cuts) paint(cut,0);
    let previous=new Map();
    for(let y=0;y<rows;y++) {
      const current=new Map();
      for(let x=0;x<cols;) {
        const index=cells[y*cols+x],start=x++;
        while(x<cols&&cells[y*cols+x]===index)x++;
        if(!index)continue;
        const id=solid[index-1].wall.id,key=id+':'+start+':'+x;
        if(previous.has(key)) {
          const box=previous.get(key);
          box.rect[3]=yCoords[y+1];current.set(key,box);
        } else {
          const box={id,rect:[xCoords[start],yCoords[y],xCoords[x],yCoords[y+1]],lo,hi};
          boxes.push(box);current.set(key,box);
        }
      }
      previous=current;
    }
  }
  const byFootprint=new Map(), merged=[];
  for(const box of boxes) {
    const key=box.id+':'+box.rect.join();
    const prior=byFootprint.get(key);
    if(prior?.hi===box.lo) prior.hi=box.hi;
    else {merged.push(box);byFootprint.set(key,box);}
  }
  return merged;
}

function buildFloor(data) {
  const zones=Object.fromEntries(Object.entries(data.parentZones).map(([id,z])=>[id,z.rects.map(r=>r.map(mm))]));
  const parent=Object.values(zones).flat();
  const rooms=data.rooms.map(source=>{
    const id=source.id;
    const rects=source.rects.map(r=>r.map(mm));
    const edges=perimeter(rects,zones[source.parent_zone],source.exterior_edges.map(toExterior),data.wallAssumption);
    const strips=edges.map(e=>strip(e,e.start,e.end,Math.min(0,e.inward*e.half),Math.max(0,e.inward*e.half)));
    const floor=partition([...rects,...strips],(x,y)=>unionContains(rects,x,y) && !unionContains(strips,x,y));
    return {source,id,rects,edges,floor,centerArea:area(rects),innerArea:area(floor),
      height:data.display.heights[source.short_id].m};
  });
  const walls=mergeWalls(rooms);
  const apertures=openings(data,rooms,walls);
  const boxes=wallSolids(walls,apertures,parent);
  const equipment=data.furniture.map(source=>({source,id:source.id,roomId:rooms.find(r=>r.source.short_id===source.room).id,
    rect:source.rect.map(mm),lo:0,hi:source.h,clear:source.clear.map(r=>r.map(mm))}));
  const origin=data.display.originXY.map(mm);
  const worldPoint=(x,y,height)=>[meters(x-origin[0]),height,meters(origin[1]-y)];
  const worldBox=({rect:[a,b,c,d],lo,hi})=>[worldPoint(a,d,lo),worldPoint(c,b,hi)];
  const worldInverse=([x,h,z])=>[x+data.display.originXY[0],data.display.originXY[1]-z,h];
  return {rooms,walls,apertures,boxes,equipment,parent,worldPoint,worldBox,worldInverse};
}

function bounds(rects) {
  return [Math.min(...rects.map(r=>r[0])),Math.min(...rects.map(r=>r[1])),
    Math.max(...rects.map(r=>r[2])),Math.max(...rects.map(r=>r[3]))];
}

function standingPoint(room,equipment) {
  const base=bounds(room.floor);
  const obstructions=equipment.filter(e=>e.roomId===room.id).map(e=>e.rect);
  let best=-Infinity,position;
  for (let y=base[1]+25;y<base[3];y+=50) for (let x=base[0]+25;x<base[2];x+=50) {
    if (!unionContains(room.floor,x,y) || unionContains(obstructions,x,y)) continue;
    const margin=Math.min(...room.edges.map(w=>{
      const a=w.orient==='h'?x:y,b=w.orient==='h'?y:x;
      return Math.hypot(Math.max(w.start-a,a-w.end,0),b-w.line)-w.half;
    }),...obstructions.map(([a,b,c,d])=>Math.hypot(Math.max(a-x,x-c,0),Math.max(b-y,y-d,0))));
    if (margin>best) {best=margin;position=[x,y];}
  }
  if (position) return position;
  const patch=room.floor.reduce((largest,r)=>rectArea(r)>rectArea(largest)?r:largest);
  return [(patch[0]+patch[2])/2,(patch[1]+patch[3])/2];
}

function hingeLeaves(opening, {inwardXY,hingeEnds}) {
  const h = opening.orient === 'h';
  const line = mm(opening.xy[h ? 1 : 0]);
  const radius = (opening.end-opening.start)/hingeEnds.length;
  return hingeEnds.map(end => {
    const coordinate = end === 'min' ? opening.start : opening.end;
    const sign = end === 'min' ? 1 : -1;
    return {
      pivot: h ? [coordinate,line] : [line,coordinate],
      along: h ? [sign,0] : [0,sign],
      normal: inwardXY,
      radius,
    };
  });
}

const sub = (a,b) => a.map((n,i) => n-b[i]);
const add = (a,b) => a.map((n,i) => n+b[i]);
const times = (a,n) => a.map(x => x*n);
const dot = (a,b) => a.reduce((sum,n,i) => sum+n*b[i],0);
const cross = (a,b) => [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const unit = a => times(a,1/Math.hypot(...a));
const UP = [0,1,0];

function cameraFrame(camera, width, height) {
  const {mode,yaw,pitch,zoom,target} = camera;
  const direction = [Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch)];
  let eye, forward, right, up;
  if (mode === 'inside') {
    eye = target;
    forward = direction;
    right = unit(cross(forward,UP));
    up = cross(right,forward);
  } else if (mode === 'plan') {
    eye = add(target,[0,14,0]);
    forward = [0,-1,0];
    right = [1,0,0];
    up = [0,0,-1];
  } else {
    eye = add(target,times(direction,camera.distance||13));
    forward = times(direction,-1);
    right = unit(cross(forward, UP));
    up = cross(right,forward);
  }
  const aspect = width/height;
  const perspective = mode === 'inside';
  const fittedSpan = Math.max(camera.spanY, camera.spanX/aspect)/zoom;
  const tangent = Math.tan((0.52/zoom));
  const sx = perspective ? 1/(aspect*tangent) : 1/(aspect*fittedSpan);
  const sy = perspective ? 1/tangent : 1/fittedSpan;
  return {
    eye,forward,right,up,sx,sy,perspective,
    project(point) {
      const delta = sub(point,eye);
      const depth = dot(forward,delta);
      const divide = perspective ? depth : 1;
      return [(dot(right,delta)*sx/divide+1)*width/2,
        (1-dot(up,delta)*sy/divide)*height/2,depth];
    },
    ray(x,y) {
      const delta = add(times(right,(2*x/width-1)/sx),times(up,(1-2*y/height)/sy));
      return perspective ? [eye, unit(add(delta,forward))] : [add(eye,delta),forward];
    }
  };
}

function hitBox([start,end],[origin,dir]) {
  let tmin = 0, tmax = Infinity;
  for (let i=0;i<3;i++) {
    if (Math.abs(dir[i]) < 1e-9) {
      if (origin[i] < start[i] || origin[i] > end[i]) return Infinity;
      continue;
    }
    const a = (start[i]-origin[i])/dir[i], b = (end[i]-origin[i])/dir[i];
    tmin = Math.max(tmin,Math.min(a,b));
    tmax = Math.min(tmax,Math.max(a,b));
    if (tmax < tmin) return Infinity;
  }
  return tmin;
}

const faces = [
  [[0,3,2,1],.81], [[4,5,6,7],1], [[0,1,5,4],.78],
  [[1,2,6,5],.63], [[2,3,7,6],.88], [[3,0,4,7],.72],
];
const boxEdges = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];

function makeGeometry() {
  const triangles = [], lines = [];
  const vertex = (out,p,color) => out.push(...p,...color);
  function line(a,b,c) {
    vertex(lines,a,c);
    vertex(lines,b,c);
  }
  function quad(points,color) {
    for (const id of [0,1,2,0,2,3]) vertex(triangles,points[id],color);
  }
  function box([[a,b,c],[d,e,f]], color, edges, wire=false) {
    const p = [[a,b,c],[d,b,c],[d,b,f],[a,b,f],[a,e,c],[d,e,c],[d,e,f],[a,e,f]];
    if (!wire) for (const [indices,shade] of faces) quad(indices.map(i=>p[i]),times(color,shade));
    if (edges) for (const [i,k] of boxEdges) line(p[i],p[k],edges);
  }
  return {triangles,lines,line,quad,box};
}

function createRenderer(canvas) {
  const gl = canvas.getContext('webgl',{antialias:true,alpha:false});
  if (!gl) return createCanvasRenderer(canvas);
  canvas.dataset.renderer = 'webgl';
  const shader = (type,source) => {
    const compiled = gl.createShader(type);
    gl.shaderSource(compiled,source);
    gl.compileShader(compiled);
    if (!gl.getShaderParameter(compiled,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(compiled));
    return compiled;
  };
  const program = gl.createProgram();
  gl.attachShader(program,shader(gl.VERTEX_SHADER,`
    attribute vec3 position, color;
    uniform vec3 eye, right, up, forward;
    uniform vec2 scale;
    uniform float perspective;
    varying vec3 rgb;
    void main() {
      vec3 d = position-eye;
      float z = dot(d,forward);
      float depth = mix(z/50.0-1.0, (50.05/49.95)*z-5.0/49.95, perspective);
      gl_Position = vec4(dot(d,right)*scale.x,dot(d,up)*scale.y,depth,mix(1.0,z,perspective));
      rgb = color;
    }`));
  gl.attachShader(program,shader(gl.FRAGMENT_SHADER,`
    precision mediump float;
    varying vec3 rgb;
    void main() { gl_FragColor = vec4(rgb,1.0); }`));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.clearColor(.90,.93,.93,1);
  const uniforms = Object.fromEntries(['eye','right','up','forward','scale','perspective']
    .map(key=>[key,gl.getUniformLocation(program,key)]));
  const position = gl.getAttribLocation(program,'position');
  const color = gl.getAttribLocation(program,'color');
  gl.enableVertexAttribArray(position);
  gl.enableVertexAttribArray(color);
  const buffers = [gl.createBuffer(),gl.createBuffer()];
  let uploadedGeometry;
  function render(frame,geometry) {
    const ratio = Math.min(window.devicePixelRatio || 1,2);
    const width = Math.max(1, Math.round(canvas.clientWidth*ratio));
    const height = Math.max(1, Math.round(canvas.clientHeight*ratio));
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
    }
    gl.viewport(0,0,width,height);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    for (const key of ['eye','right','up','forward']) gl.uniform3fv(uniforms[key],frame[key]);
    gl.uniform2f(uniforms.scale,frame.sx,frame.sy);
    gl.uniform1f(uniforms.perspective,Number(frame.perspective));
    const layers = [[geometry.triangles,gl.TRIANGLES],[geometry.lines,gl.LINES]];
    for (const [index,[data,mode]] of layers.entries()) {
      gl.bindBuffer(gl.ARRAY_BUFFER,buffers[index]);
      if (uploadedGeometry !== geometry) gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.STATIC_DRAW);
      gl.vertexAttribPointer(position,3,gl.FLOAT,false,24,0);
      gl.vertexAttribPointer(color,3,gl.FLOAT,false,24,12);
      if (mode === gl.TRIANGLES) {
        gl.enable(gl.POLYGON_OFFSET_FILL);
        gl.polygonOffset(1,1);
      } else gl.disable(gl.POLYGON_OFFSET_FILL);
      gl.drawArrays(mode,0,data.length/6);
    }
    uploadedGeometry = geometry;
  }
  return render;
}

// Real depth-tested software 3D for browsers where WebGL is unavailable.
function createCanvasRenderer(canvas) {
  const ctx=canvas.getContext('2d',{alpha:false});
  if(!ctx) throw new Error('3D表示に必要なCanvasを利用できません。');
  canvas.dataset.renderer='canvas';
  let image, pixels, depth;
  const pack=(r,g,b)=>0xff000000|(Math.round(b*255)<<16)|(Math.round(g*255)<<8)|Math.round(r*255);
  const background=pack(.90,.93,.93);

  return function render(frame,geometry) {
    const scale=Math.min(window.devicePixelRatio||1,1.40,1150/canvas.clientWidth,780/canvas.clientHeight);
    const width=Math.max(1,Math.round(canvas.clientWidth*scale));
    const height=Math.max(1,Math.round(canvas.clientHeight*scale));
    if(!image||canvas.width!==width||canvas.height!==height) {
      canvas.width=width;canvas.height=height;
      image=ctx.createImageData(width,height);
      pixels=new Uint32Array(image.data.buffer);
      depth=new Float32Array(width*height);
    }
    pixels.fill(background);
    depth.fill(-Infinity);
    const near=frame.perspective?.05:0;
    function unpack(data,i) {
      const delta=[data[i]-frame.eye[0],data[i+1]-frame.eye[1],data[i+2]-frame.eye[2]];
      return [dot(frame.right,delta),dot(frame.up,delta),dot(frame.forward,delta)];
    }
    function project([x,y,z]) {
      const inv=frame.perspective?1/z:1;
      return [(x*frame.sx*inv+1)*width*.5,(1-y*frame.sy*inv)*height*.5,frame.perspective?inv:-z];
    }
    const cut=(a,b)=>{
      const t=(near-a[2])/(b[2]-a[2]);
      return [a[0]+t*(b[0]-a[0]),a[1]+t*(b[1]-a[1]),near];
    };
    function triangle(a,b,c,color) {
      const dx=b[0]-a[0],dy=b[1]-a[1],ex=c[0]-a[0],ey=c[1]-a[1];
      const det=dx*ey-dy*ex;
      if(Math.abs(det)<1e-8)return;
      const xmin=Math.max(0,Math.floor(Math.min(a[0],b[0],c[0])));
      const xmax=Math.min(width-1,Math.ceil(Math.max(a[0],b[0],c[0])));
      const ymin=Math.max(0,Math.floor(Math.min(a[1],b[1],c[1])));
      const ymax=Math.min(height-1,Math.ceil(Math.max(a[1],b[1],c[1])));
      const vStep=ey/det,wStep=-dy/det;
      for(let y=ymin;y<=ymax;y++) {
        const yy=y+.5-a[1],xx=xmin+.5-a[0];
        let v=(xx*ey-yy*ex)/det,w=(dx*yy-dy*xx)/det;
        let idx=y*width+xmin;
        for(let x=xmin;x<=xmax;x++,idx++,v+=vStep,w+=wStep) {
          if(v<-.000001||w<-.000001||v+w>1.000001)continue;
          const z=a[2]+v*(b[2]-a[2])+w*(c[2]-a[2]);
          if(z>=depth[idx]) { depth[idx]=z;pixels[idx]=color; }
        }
      }
    }
    const tris=geometry.triangles;
    for(let i=0;i<tris.length;i+=18) {
      const vertices=[unpack(tris,i),unpack(tris,i+6),unpack(tris,i+12)];
      const clipped=[];
      for(let j=0;j<3;j++) {
        const a=vertices[(j+2)%3],b=vertices[j];
        if((a[2]>=near)!==(b[2]>=near))clipped.push(cut(a,b));
        if(b[2]>=near)clipped.push(b);
      }
      if(clipped.length<3)continue;
      const poly=clipped.map(project),color=pack(tris[i+3],tris[i+4],tris[i+5]);
      for(let j=1;j+1<poly.length;j++)triangle(poly[0],poly[j],poly[j+1],color);
    }
    // Clip each projected segment to the framebuffer before walking its pixels.
    const lines=geometry.lines;
    for(let i=0;i<lines.length;i+=12) {
      let a=unpack(lines,i),b=unpack(lines,i+6);
      if(a[2]<near&&b[2]<near)continue;
      if(a[2]<near)a=cut(a,b);
      if(b[2]<near)b=cut(b,a);
      a=project(a);b=project(b);
      const dx=b[0]-a[0],dy=b[1]-a[1],dz=b[2]-a[2];
      let from=0,to=1,visible=true;
      for(const [p,d,min,max] of [[a[0],dx,0,width-1],[a[1],dy,0,height-1]]) {
        if(!d) {if(p<min||p>max)visible=false;continue;}
        const l=(min-p)/d,r=(max-p)/d;
        from=Math.max(from,Math.min(l,r));
        to=Math.min(to,Math.max(l,r));
      }
      if(!visible||to<from)continue;
      const count=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))*(to-from)));
      const color=pack(lines[i+3],lines[i+4],lines[i+5]);
      for(let j=0;j<=count;j++) {
        const t=from+(to-from)*j/count;
        const idx=Math.round(a[1]+dy*t)*width+Math.round(a[0]+dx*t);
        const z=a[2]+dz*t;
        const tolerance=frame.perspective?.0012*Math.max(1,z*z):.026;
        if(z+tolerance>=depth[idx]) { depth[idx]=Math.max(z,depth[idx]);pixels[idx]=color; }
      }
    }

  };
}

    }
    get('details').replaceChildren(dl);
    for(const o of items.values())o.label?.classList.toggle('active',o.id===id);
    meshes();refresh();
  }
  function updateChoices() {
    zoneChoice.value=zone;
    roomChoice.replaceChildren(new Option(zone?'区画全体':'先に区画を選択',''));
    if(zone)for(const r of zoneRooms[zone])roomChoice.add(new Option(r.source.name,r.id));
    roomChoice.value=roomId;roomChoice.disabled=!zone;
    document.querySelector('[data-view=inside]').disabled=zone==='C';
    const groups=new Map();
    choice.replaceChildren();
    for(const o of items.values()) {
      if(!visible(o)||zone&&o.zoneKey&&o.zoneKey!==zone)continue;
      let g=groups.get(o.group);
      if(!g){g=document.createElement('optgroup');g.label=o.group;groups.set(o.group,g);choice.append(g);}
      g.append(new Option(o.title,o.id));
    }
  }
  function setView(next,{resetWalls=false}={}) {
    mode=next;
    if(mode==='inside'&&!roomId) {
      if(!zone||zone==='C')zone='R';
      const r=zoneRooms[zone].find(r=>r.source.kind==='living')||zoneRooms[zone][0];
      roomId=r.id;
    }
    if(zone==='C'&&mode==='inside')mode='orbit';
    visibleIds=new Set(roomSetFor(zone).map(r=>r.id));
    updateChoices();
    if(resetWalls)get('walls').value=mode==='inside'?'full':'cut';
    const focus=rooms.get(roomId), box=bounds(focus?.rects|| (zone?zoneRooms[zone].flatMap(r=>r.rects):[floorBounds]));
    const [a,b,c,d]=box, radius=Math.hypot(c-a,d-b)/2000;
    const plan=mode==='plan',interior=mode==='inside';
    let xy=[(a+c)/2,(b+d)/2];
    if(interior) {
      if(!standing.has(focus.id))standing.set(focus.id,standingPoint(focus,model.equipment));
      xy=standing.get(focus.id);
    }
    camera={mode,yaw:interior?-.67:.36,pitch:interior?.06:.88,zoom:1,
      target:point(...xy,interior?1.56:plan?0:.69),distance:Math.max(13,radius+9),spanX:1,spanY:1};
    if(!interior) {
      const f=cameraFrame(camera,2,2);
      for(const x of [a-540,c+540])for(const y of [b-530,d+530])for(const h of [0,plan?0:2.45]) {
        const [sx,sy]=f.project(point(x,y,h));
        camera.spanX=Math.max(camera.spanX,Math.abs(sx-1)*1.07);
        camera.spanY=Math.max(camera.spanY,Math.abs(sy-1)*1.08);
      }
    }
    for(const b of document.querySelectorAll('[data-view]'))b.setAttribute('aria-pressed',String(b.dataset.view===mode));
    get('gesture').textContent=plan?'北を上に固定 · ピンチで拡大・縮小':interior?'1本指で見回す · ピンチで視野調整':'1本指で回転 · ピンチで拡大・縮小';
    select(roomId||(zone?'zone:'+zone:summary));
  }
  function chooseZone(key) {
    zone=key;roomId='';
    setView(!zone||zone==='C'&&mode==='inside'?'orbit':mode,{resetWalls:!zone});
  }
  function useLabel(o) {
    if(o.layer==='zone')chooseZone(o.zoneKey);
    else if(o.layer==='room') {
      roomId=o.id;zone=zoneOf(o.id);setView(zone==='C'&&mode==='inside'?'orbit':mode);
    } else select(o.id);
  }
  function rotate(dx,dy) {
    if(mode==='plan')return;
    camera.yaw+=(mode==='inside'?1:-1)*dx*.008;
    camera.pitch=clamp(camera.pitch+dy*.008,mode==='inside'?-1.43:.06,1.51);
    refresh();
  }
  function zoom(scale) {camera.zoom=clamp(camera.zoom*scale,mode==='inside'?.64:.4,5);refresh();}
  const distance=()=>{
    const [a,b]=pointers.values();
    return a&&b?Math.hypot(a.x-b.x,a.y-b.y):0;
  };
  viewport.addEventListener('pointerdown',event=>{
    if(event.target.closest('.zoom')||(event.pointerType==='mouse'&&event.button!==0))return;
    if(!pointers.size)gestureMoved=false;
    pointers.set(event.pointerId,{x:event.clientX,y:event.clientY,startX:event.clientX,startY:event.clientY});
    (event.target.closest('.label')||viewport).setPointerCapture(event.pointerId);
    lastDistance=distance();
    if(pointers.size>1)gestureMoved=true;
  });
  viewport.addEventListener('pointermove',event=>{
    const p=pointers.get(event.pointerId);
    if(!p)return;
    const {clientX:x,clientY:y}=event;
    if(Math.hypot(x-p.startX,y-p.startY)>5)gestureMoved=true;
    pointers.set(event.pointerId,{...p,x,y});
    if(pointers.size>1) {
      const next=distance();
      if(next>5&&lastDistance>5)zoom(next/lastDistance);
      lastDistance=next;
    } else if(gestureMoved)rotate(x-p.x,y-p.y);
  });
  function end(event) {
    if(!pointers.delete(event.pointerId))return;
    lastDistance=distance();
    if(event.type!=='pointerup'||gestureMoved||pointers.size||!frame)return;
    const label=event.target.closest('.label');
    if(label){useLabel(items.get(label.dataset.object));return;}
    const rect=viewport.getBoundingClientRect(),ray=frame.ray(event.clientX-rect.left,event.clientY-rect.top);
    let best=Infinity,id;
    for(const p of pickers) {
      const depth=hitBox(p.box,ray);
      if(depth<best){best=depth;id=p.id;}
    }
    if(id)select(id);
  }
  for(const t of ['pointerup','pointercancel','lostpointercapture'])viewport.addEventListener(t,end);
  for(const t of ['touchstart','touchmove','gesturestart','gesturechange']) {
    viewport.addEventListener(t,e=>{if(!e.target.closest('.zoom')&&e.cancelable)e.preventDefault();},{passive:false});
  }
  viewport.addEventListener('wheel',e=>{if(e.cancelable)e.preventDefault();zoom(Math.exp(-clamp(e.deltaY,-120,120)*.0025));},{passive:false});
  viewport.addEventListener('keydown',e=>{
    if(e.target!==viewport)return;
    const keys={ArrowLeft:[-14,0],ArrowRight:[14,0],ArrowUp:[0,-14],ArrowDown:[0,14]};
    if(keys[e.key]){e.preventDefault();rotate(...keys[e.key]);}
    if(['+','=','-'].includes(e.key)){e.preventDefault();zoom(e.key==='-'?1/1.2:1.2);}
  });
  zoneChoice.addEventListener('change',()=>chooseZone(zoneChoice.value));
  roomChoice.addEventListener('change',()=>{roomId=roomChoice.value;setView(!roomId&&mode==='inside'?'orbit':mode);});
  choice.addEventListener('change',()=>select(choice.value));
  document.querySelector('.layers').addEventListener('change',()=>{meshes();refresh();});
  document.querySelector('.layers').addEventListener('submit',e=>e.preventDefault());
  for(const button of document.querySelectorAll('[data-view]'))button.addEventListener('click',()=>setView(button.dataset.view,{resetWalls:true}));
  get('reset').addEventListener('click',()=>{zone='';roomId='';setView('orbit',{resetWalls:true});});
  get('plus').addEventListener('click',()=>zoom(1.2));get('minus').addEventListener('click',()=>zoom(1/1.2));
  canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();render=null;showError('描画が停止しました。復帰を待つか再読み込みしてください。');});
  canvas.addEventListener('webglcontextrestored',()=>{
    try{render=createRenderer(canvas);status.hidden=true;refresh();}catch(error){showError(error.message);}
  });
  new ResizeObserver(refresh).observe(viewport);
  setView('orbit',{resetWalls:true});
}
start().catch(error=>{showError(error.message);console.error(error);});

</script>
</head>
<body>
<header class="mast">
 <div><p>魔法学校・第五寮</p><h1>東翼3階</h1></div>
 <div class="version">Stage2c v1.1 ＋ Stage2b_r1<span>統合実寸3D</span></div>
</header>
<main>
 <section class="workspace" aria-label="3Dビューア">
  <div class="toolbar" aria-label="視点">
   <button type="button" data-view="orbit" aria-pressed="true">俯瞰</button>
   <button type="button" data-view="plan" aria-pressed="false">平面</button>
   <button type="button" data-view="inside" aria-pressed="false">室内</button>
   <button type="button" id="reset">全体に戻る</button>
  </div>
  <div class="navigation">
   <label>区画 <select id="zone"><option value="">全体</option></select></label>
   <label>部屋 <select id="room"><option value="">区画を選択</option></select></label>
  </div>
  <div class="viewport" id="viewport" tabindex="0" aria-label="3D表示。矢印で回転、プラスとマイナスで拡大縮小">
   <canvas id="scene" aria-hidden="true"></canvas><div class="labels" id="labels"></div>
   <div id="compass" aria-hidden="true"><span id="north">↑</span><b>北</b></div>
   <div class="zoom" aria-label="拡大縮小"><button type="button" id="plus" aria-label="拡大">＋</button><button type="button" id="minus" aria-label="縮小">−</button></div>
   <p id="loading" role="status">3Dモデルを読み込んでいます…</p>
  </div>
  <div class="caption"><span id="gesture">1本指で回転 · ピンチで拡大・縮小</span><span>1単位 = 1m</span></div>
  <div class="palette" id="zone-legend" aria-label="区画凡例"></div>
  <details class="layer-panel" open>
   <summary>表示設定</summary>
   <form class="layers" aria-label="表示レイヤー">
    <label>壁 <select id="walls"><option value="cut">断面</option><option value="full">全高</option><option value="none">非表示</option></select></label>
    <label><input id="furniture" type="checkbox" checked>家具・設備</label>
    <label><input id="zone-names" type="checkbox" checked>区画名</label>
    <label><input id="room-names" type="checkbox">部屋名</label>
    <label><input id="fixture-names" type="checkbox">家具名</label>
    <label><input id="doors" type="checkbox" checked>扉・開口</label>
    <label><input id="windows" type="checkbox" checked>外窓</label>
    <label><input id="dimensions" type="checkbox">寸法線</label>
    <label><input id="clearance" type="checkbox">クリアランス</label>
    <label><input id="lightwell" type="checkbox" checked>光井戸</label>
    <label><input id="route" type="checkbox">ラウンジ動線</label>
    <label><input id="boundaries" type="checkbox">共有壁・境界</label>
   </form>
  </details>
 </section>
 <aside class="inspection" aria-labelledby="inspection-title">
  <header class="inspect-head"><h2 id="inspection-title">寸法・座標</h2><label class="sr" for="object">確認対象</label><select id="object"></select></header>
  <div id="details" aria-live="polite"></div>
  <p class="caution">土色は扉・開口、紫は認証付き扉、青は外窓と光井戸。開口高と天井高の根拠は寸法欄に表示します。</p>
  <nav class="suite-links" aria-label="個別ビューア">
   <a href="../r-suite/">Rスイート</a><a href="../t-suite/">Tスイート</a><a href="../k-suite/">Kスイート</a><a href="../private-lounge/">専用ラウンジ</a>
  </nav>
 </aside>
</main>
</body>
</html>
