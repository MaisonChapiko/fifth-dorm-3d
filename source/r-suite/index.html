<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102729">
<title>第五寮 | Rスイート 実寸3D</title>
<link rel="stylesheet" href="styles.css">
<script type="module" src="viewer.js"></script>
</head>
<body>
<header class="mast">
  <div><p>魔法学校・第五寮 ／ 東翼3階</p><h1 id="title">Rスイート</h1></div>
  <div class="version">Stage2c v1.1<span>実寸3D</span></div>
</header>
<main>
  <section class="workspace" aria-label="3Dビューア">
    <div class="toolbar" aria-label="視点">
      <button type="button" data-view="orbit" aria-pressed="true">俯瞰</button>
      <button type="button" data-view="plan" aria-pressed="false">平面</button>
      <button type="button" data-view="inside" aria-pressed="false">室内</button>
      <button type="button" id="reset">リセット</button>
    </div>
    <div class="room-control"><label for="room">移動先</label><select id="room"><option value="">スイート全体</option></select></div>
    <div class="viewport" id="viewport" tabindex="0" aria-label="3D表示。矢印で回転、プラスとマイナスで拡大縮小">
      <canvas id="scene" aria-hidden="true"></canvas>
      <div id="labels" class="labels"></div>
      <div id="compass" aria-hidden="true"><span id="north">↑</span><b>北</b></div>
      <div class="zoom" aria-label="拡大縮小">
        <button type="button" id="plus" aria-label="拡大">＋</button>
        <button type="button" id="minus" aria-label="縮小">−</button>
      </div>
      <div id="loading" role="status">3Dモデルを読み込んでいます…</div>
    </div>
    <div class="caption"><span id="gesture">1本指で回転 · ピンチで拡大・縮小</span><span>1単位 = 1m</span></div>
    <form class="layers" aria-label="表示レイヤー">
      <label>壁 <select id="walls"><option value="cut">断面</option><option value="full">全高</option><option value="none">非表示</option></select></label>
      <label><input type="checkbox" id="equipment" checked>家具・設備</label>
      <label><input type="checkbox" id="names" checked>部屋名</label>
      <label><input type="checkbox" id="fixture-names">家具名</label>
      <label><input type="checkbox" id="clearance">クリアランス</label>
    </form>
  </section>
  <section class="inspection" aria-labelledby="inspection-title">
    <header class="inspect-head">
      <h2 id="inspection-title">寸法・座標</h2>
      <label for="object" class="sr">確認対象</label><select id="object"></select>
    </header>
    <div id="details" aria-live="polite"></div>
    <div class="key" aria-label="凡例"><span class="door-key">扉・通路開口</span><span class="window-key">外窓</span><span class="space-key">指定クリアランス</span></div>
    <p class="caution">開口高2.10mと外窓の上端2.40mは表示用の暫定値です。書斎欄間は記号で示します。</p>
    <a class="bath-link" href="../">R浴室単体ビューアへ</a>
  </section>
</main>
</body>
</html>
